name: live-tests

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        model: ['perplexity/pplx-decider-flash-v1.3:free', 'perplexity/pplx-decider-v1.3:free', 'parallel/decisions-fast', '~perplexity/pplx-decider-flash-latest', 'respan/span-02', '~perplexity/pplx-decider-latest', '~liquid/d1-latest', 'baseten/elephant-1', '~typesafe/jev-latest', '~liquid/d1-ultra-latest', 'microsoft/microsoft-decision-1', 'nace-ai/drex-max-finance', 'nace-ai/drex-max', 'heygen/heygen-decision-1-turbo']

    name: openrouter - ${{ matrix.model }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute live tests
        run: vendor/bin/pest --group=live
        env:
          THREAT_BLOCKER_AI_SPAM_DETECTOR_PROVIDER: openrouter
          THREAT_BLOCKER_AI_SPAM_DETECTOR_MODEL: ${{ matrix.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
